{{ define "main" }}
{{ $terms := .Pages }}
<section class="pt-36 pb-12 px-4">
  <div class="max-w-3xl mx-auto">
    <h1 class="text-3xl md:text-5xl font-lalezar text-text-primary mb-2">{{ .Title }}</h1>
    <p class="text-text-secondary mb-8 font-sahel">اصطلاحات رایج در حوزه وام‌ها و تسهیلات بانکی</p>
    <div class="space-y-4">
      {{ range $terms }}
      <div class="card p-5 hover:border-accent transition-colors" id="{{ .Params.term_id }}">
        <div class="flex items-start gap-4">
          <span class="text-2xl font-lalezar text-accent flex-shrink-0 mt-0.5">{{ slicestr .Title 0 1 }}</span>
          <div>
            <a href="{{ .RelPermalink }}" class="text-lg font-lalezar text-text-primary hover:text-accent transition-colors no-underline">{{ .Title }}</a>
            <p class="text-sm text-text-secondary mt-1 leading-relaxed font-sahel">{{ .Description }}</p>
          </div>
        </div>
      </div>
      {{ end }}
    </div>
  </div>
</section>
{{ end }}
