{{ define "main" }}
<section class="pt-36 pb-12 px-4">
  <div class="max-w-3xl mx-auto">
    <div class="mb-6">
      <a href="/glossary/" class="text-sm text-text-secondary hover:text-accent transition-colors no-underline font-sahel">← بازگشت به واژه‌نامه</a>
    </div>
    <div class="card p-6">
      <div class="flex items-center gap-4 mb-4">
        <span class="text-3xl font-lalezar text-accent">{{ slicestr .Title 0 1 }}</span>
        <h1 class="text-2xl md:text-3xl font-lalezar text-text-primary">{{ .Title }}</h1>
      </div>
      <div class="prose-content">
        {{ .Content }}
      </div>
    </div>
  </div>
</section>
{{ end }}
